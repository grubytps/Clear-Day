name: Buduj ClearDay APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Pobierz projekt
        uses: actions/checkout@v4

      - name: Rozpakuj projekt
        run: |
          unzip -q ClearDay-Android.zip -d .clearday
          rsync -a .clearday/ ./

      - name: Ustaw Javę
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Ustaw Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Zbuduj APK
        run: gradle assembleDebug --no-daemon

      - name: Zapisz APK
        uses: actions/upload-artifact@v4
        with:
          name: ClearDay-APK
          path: app/build/outputs/apk/debug/app-debug.apk
